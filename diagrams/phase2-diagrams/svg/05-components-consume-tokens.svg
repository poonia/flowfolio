<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -20 1220 770" width="1220" height="770" role="img" aria-label="How components consume tokens"><title>How components consume tokens</title><defs><marker id="ah22c55e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker><marker id="sah22c55e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#22c55e"/></marker><marker id="ah1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker><marker id="sah1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker><marker id="ahef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker><marker id="sahef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/></marker></defs><rect x="-40" y="-20" width="1220" height="770" fill="#ffffff"/><text font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="366.0" y="32.4">5. How Components Consume Tokens</tspan></text><rect x="0" y="80" width="210" height="110" rx="12" fill="#fff3bf" stroke="#f59e0b" stroke-width="2" opacity="1.0"/><text font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="105.0" y="116.5">Author picks a</tspan><tspan x="105.0" y="139.1">Style System</tspan><tspan x="105.0" y="161.6">variant</tspan></text><polyline points="210,135 270,135" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah1e1e1e)"/><rect x="270" y="80" width="210" height="110" rx="12" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2" opacity="1.0"/><text font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="375.0" y="116.5">Markup unchanged</tspan><tspan x="375.0" y="139.1">class added:</tspan><tspan x="375.0" y="161.6">.cmp-button--secondary</tspan></text><polyline points="480,135 540,135" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah1e1e1e)"/><rect x="540" y="80" width="210" height="110" rx="12" fill="#d0bfff" stroke="#8b5cf6" stroke-width="2" opacity="1.0"/><text font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="645.0" y="116.5">Variant class</tspan><tspan x="645.0" y="139.1">swaps component</tspan><tspan x="645.0" y="161.6">tokens</tspan></text><polyline points="750,135 810,135" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah1e1e1e)"/><rect x="810" y="80" width="210" height="110" rx="12" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2" opacity="1.0"/><text font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="915.0" y="116.5">CSS reads</tspan><tspan x="915.0" y="139.1">var(--ds-button-bg)</tspan><tspan x="915.0" y="161.6">+ semantic fallback</tspan></text><polyline points="915,190 915,250" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah1e1e1e)"/><rect x="810" y="250" width="210" height="100" rx="12" fill="#ffd8a8" stroke="#f59e0b" stroke-width="2" opacity="1.0"/><text font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="915.0" y="281.6">Semantic token</tspan><tspan x="915.0" y="304.1">resolved by</tspan><tspan x="915.0" y="326.6">tenant theme</tspan></text><polyline points="810,300 750,300" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah1e1e1e)"/><rect x="540" y="250" width="210" height="100" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2" opacity="1.0"/><text font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="645.0" y="281.6">Rendered button</tspan><tspan x="645.0" y="304.1">correct brand</tspan><tspan x="645.0" y="326.6">per site</tspan></text><rect x="-10" y="230" width="520" height="220" rx="12" fill="#f8f9fa" stroke="#757575" stroke-width="1" opacity="1.0"/><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="18" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="5.0" y="259.4">.cmp-button {</tspan><tspan x="5.0" y="281.9">  background: var(--ds-button-bg,</tspan><tspan x="5.0" y="304.4">    var(--ds-color-action-primary-default));</tspan><tspan x="5.0" y="326.9">}</tspan><tspan x="5.0" y="349.4">.cmp-button--secondary {</tspan><tspan x="5.0" y="371.9">  --ds-button-bg:</tspan><tspan x="5.0" y="394.4">    var(--ds-color-action-secondary-default);</tspan><tspan x="5.0" y="416.9">}</tspan></text><rect x="540" y="380" width="480" height="70" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2" opacity="1.0"/><text font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="780.0" y="419.1">Markup unchanged → no content migration</tspan></text><text font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#1e1e1e" text-anchor="start" xml:space="preserve"><tspan x="0.0" y="526.0">Build gate (stylelint)</tspan></text><rect x="0" y="570" width="210" height="100" rx="12" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2" opacity="1.0"/><text font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="105.0" y="612.8">Developer</tspan><tspan x="105.0" y="635.3">changes CSS</tspan></text><polyline points="210,620 270,620" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah1e1e1e)"/><polygon points="380.0,545 490,620.0 380.0,695 270,620.0" fill="#fff3bf" stroke="#f59e0b" stroke-width="2" opacity="1.0"/><text font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="380.0" y="612.8">Raw hex or</tspan><tspan x="380.0" y="635.3">px value?</tspan></text><polyline points="490,620 570,575" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#ahef4444)"/><rect x="570" y="540" width="210" height="70" rx="12" fill="#ffc9c9" stroke="#ef4444" stroke-width="2" opacity="1.0"/><text font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="675.0" y="579.0">Yes: build fails</tspan></text><polyline points="490,620 570,665" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#ah22c55e)"/><rect x="570" y="630" width="210" height="70" rx="12" fill="#b2f2bb" stroke="#22c55e" stroke-width="2" opacity="1.0"/><text font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="675.0" y="669.0">No: build passes</tspan></text><rect x="850" y="540" width="300" height="180" rx="12" fill="#fff3bf" stroke="#f59e0b" stroke-width="2" opacity="1.0"/><text font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#1e1e1e" text-anchor="middle" xml:space="preserve"><tspan x="1000.0" y="589.0">Phase 2: button is the</tspan><tspan x="1000.0" y="611.5">reference implementation</tspan><tspan x="1000.0" y="634.0"> </tspan><tspan x="1000.0" y="656.5">Phase 3: same pattern</tspan><tspan x="1000.0" y="679.0">for 6-8 components</tspan></text></svg>