<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Token cascade (HTML example)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 32px; color: #1e1e1e; background: #fff; }
  h1 { font-size: 22px; margin: 0 0 24px; }
  .row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .box { border: 2px solid; border-radius: 10px; padding: 14px 18px; min-width: 160px; }
  .box b { display: block; margin-bottom: 4px; }
  .box code { font-size: 13px; }
  .prim { border-color: #1971c2; background: #e7f5ff; }
  .sem  { border-color: #2f9e44; background: #ebfbee; }
  .comp { border-color: #e8590c; background: #fff4e6; }
  .arrow { font-size: 24px; color: #868e96; }
</style>
</head>
<body>
  <h1>Token cascade: primitive → semantic → component</h1>
  <div class="row">
    <div class="box prim"><b>Primitive</b><code>--blue-600: #1971c2</code></div>
    <span class="arrow">→</span>
    <div class="box sem"><b>Semantic</b><code>--color-action: var(--blue-600)</code></div>
    <span class="arrow">→</span>
    <div class="box comp"><b>Component</b><code>--button-bg: var(--color-action)</code></div>
  </div>
</body>
</html>
